<!DOCTYPE html>
<html id="splendid" lang="en-US">
	{% include head.html %}
	<body id="archive">
		{% if jekyll.environment == 'production' and site.scripts.gtm %}
			<!-- Google Tag Manager (noscript) -->
			<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.scripts.gtm }}"
			height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
			<!-- End Google Tag Manager (noscript) -->
		{% endif %}
		{% include header.html %}

		{{ content }}

		{% include footer.html %}

		<!-- Start of HubSpot Embed Code -->
		<script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/3309838.js"></script>
		<!-- End of HubSpot Embed Code -->
	</body>
</html>
