<!DOCTYPE html>
<html id="splendid" lang="en-US">
	{% include head.html %}
	<body id="default" class="overflow-x-hidden">
		{% if jekyll.environment == 'production' and site.scripts.gtm %}
			<!-- Google Tag Manager (noscript) -->
			<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.scripts.gtm }}"
			height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
			<!-- End Google Tag Manager (noscript) -->
		{% endif %}
		{% include header.html %}
		<div class="px-7 md:px-10 md:pb-14 bg-yellow">
			<h1 class="relative max-w-4 lg:mx-auto mb-0 pt-20 md:pb-2 text-3xl lg:text-4xl font-bold">{{ page.title }}</h1>
			{{ if page.subtitle }}
				<div class="relative max-w-4 lg:mx-auto md:pb-2 text-lg lg:text-xl font-bold">{{ page.subtitle }}</div>
			{{ endif }}
		</div>
		<main class="lg:pt-8 pb-16 px-7 md:px-10">
			{{ content }}
		</main>
		{% include footer.html %}
	</body>
</html>
